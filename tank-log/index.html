<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tank Log</title>
  <meta name="description" content="Log saltwater aquarium water parameters, run test-kit timers, see trends against your target ranges and share the results.">
  <meta name="theme-color" content="#0e7c86">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="bar">
      <a class="hub" href="../" title="reef42">reef42</a>
      <a class="brand" href="#/measure" aria-label="Tank Log">
        <img src="assets/favicon.svg" alt="" width="26" height="26">
        <span>Tank Log</span>
      </a>
      <button class="lang" id="langToggle" type="button" aria-label="Language"></button>
    </div>
    <div class="navrow">
      <nav class="tabs" id="tabs" aria-label="Main"></nav>
      <label class="tanksel">
        <span id="tankLabel">Tank</span>
        <select id="tankSelect" aria-labelledby="tankLabel"></select>
      </label>
    </div>
    <div class="dock" id="dock" hidden></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main id="app" tabindex="-1"></main>

  <footer class="footer" id="footer"></footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="../shared/lang.js" defer></script>
  <script src="assets/app.js" defer></script>

</html>
