<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reef42 links</title>
  <meta name="description" content="Useful links for saltwater aquarium keepers: Hungarian and European shops, communities, manufacturers and tools.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #000; --text: #fff; --muted: #8a8a8a; --line: #262626; --card: #0b0b0b; --card-hover: #151515; --accent: #3cc2cc; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-transform: lowercase;
    }
    a { color: inherit; }
    .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
    header { padding-top: 40px; padding-bottom: 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .back { display: inline-block; color: var(--muted); text-decoration: none; font-size: .9rem; margin-bottom: 12px; }
    .back:hover { color: var(--text); }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.2rem); font-weight: 700; letter-spacing: -.03em; line-height: 1; }
    .lead { margin: 10px 0 0; color: var(--muted); }
    .pill {
      font: inherit; font-size: .85rem; font-weight: 600; text-transform: lowercase; color: var(--text); background: transparent;
      border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap;
    }
    .pill:hover { border-color: var(--text); }
    .pill[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
    .pill:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    main { flex: 1; padding-bottom: 48px; }
    .filters { display: grid; gap: 10px; margin-bottom: 20px; }
    .frow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .flabel { color: var(--muted); font-size: .8rem; min-width: 5.5em; }
    .search {
      width: 100%; max-width: 420px; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 12px;
    }
    .search::placeholder { color: var(--muted); }
    .count { color: var(--muted); font-size: .85rem; margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
    .card {
      display: flex; flex-direction: column; gap: 6px; height: 100%; padding: 14px 16px 16px; text-decoration: none;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px; transition: background .15s, border-color .15s;
    }
    a.card:hover { background: var(--card-hover); border-color: #444; }
    .card.own { border-color: #2c5c60; }
    .card.soon { opacity: .7; }
    .card h2 { margin: 0; font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
    .card p { margin: 0; color: var(--muted); font-size: .92rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; font-size: .75rem; }
    .tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
    .tag.own { color: var(--accent); border-color: #2c5c60; }
    .host { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
    .empty { color: var(--muted); }
    footer { border-top: 1px solid var(--line); padding-top: 20px; padding-bottom: 20px; color: var(--muted); font-size: .85rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; }
    footer a { color: var(--text); text-underline-offset: 3px; }
  </style>
</head>
<body>
  <header class="wrap">
    <div>
      <a class="back" href="../" data-i18n="back">← reef42</a>
      <h1 data-i18n="title">links</h1>
      <p class="lead" data-i18n="lead">shops, communities, manufacturers and tools for reef keepers</p>
    </div>
    <button class="pill" id="lang" type="button" aria-label="Language"></button>
  </header>

  <main class="wrap">
    <div class="filters">
      <input class="search" id="q" type="search" autocomplete="off">
      <div class="frow" id="regions" role="group"></div>
      <div class="frow" id="cats" role="group"></div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <ul class="grid" id="list"></ul>
  </main>

  <footer class="wrap">
    <span data-i18n="suggest">know a good link? tell us:</span>
    <a href="mailto:info.reef42@gmail.com">info.reef42@gmail.com</a>
  </footer>

  <script src="links.js"></script>
  <script>
    (function () {
      var TEXT = {
        en: {
          back: '← reef42', title: 'links', lead: 'shops, communities, manufacturers and tools for reef keepers',
          suggest: 'know a good link? tell us:', toggle: 'magyar', search: 'search…', region: 'region', type: 'type', all: 'all',
          hu: 'hungary', eu: 'europe', intl: 'international',
          community: 'community', shop: 'shops', brand: 'manufacturers & labs', tools: 'tools & apps', learn: 'news & knowledge',
          count: '{n} links', none: 'no links match the filters.', soon: 'link coming soon', own: 'by reef42',
          docTitle: 'links – reef42'
        },
        hu: {
          back: '← reef42', title: 'linkek', lead: 'boltok, közösségek, gyártók és eszközök tengeri akvaristáknak',
          suggest: 'tudsz egy jó linket? írd meg:', toggle: 'english', search: 'keresés…', region: 'régió', type: 'típus', all: 'mind',
          hu: 'magyarország', eu: 'európa', intl: 'nemzetközi',
          community: 'közösség', shop: 'boltok', brand: 'gyártók és laborok', tools: 'eszközök és appok', learn: 'hírek és tudás',
          count: '{n} link', none: 'nincs a szűrésnek megfelelő link.', soon: 'link hamarosan', own: 'reef42',
          docTitle: 'linkek – reef42'
        }
      };
      var REGIONS = ['hu', 'eu', 'intl'];
      var CATS = ['community', 'shop', 'brand', 'tools', 'learn'];
      var LINKS = window.REEF42_LINKS || [];
      var KEY = 'reef42-lang';
      function load() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
      function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
      var lang = new URLSearchParams(location.search).get('lang') || load() ||
        ((navigator.language || '').toLowerCase().indexOf('hu') === 0 ? 'hu' : 'en');
      if (lang !== 'hu') lang = 'en';

      var state = { region: '', cat: '', q: '' };
      (function readHash() {
        var p = new URLSearchParams(location.hash.slice(1));
        if (REGIONS.indexOf(p.get('r')) >= 0) state.region = p.get('r');
        if (CATS.indexOf(p.get('c')) >= 0) state.cat = p.get('c');
      })();
      function writeHash() {
        var p = new URLSearchParams();
        if (state.region) p.set('r', state.region);
        if (state.cat) p.set('c', state.cat);
        var h = p.toString();
        history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
      }

      function t(k) { return TEXT[lang][k]; }
      function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
      function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
      function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }

      function pills(el, list, key) {
        el.innerHTML = '<span class="flabel">' + esc(t(key === 'region' ? 'region' : 'type')) + '</span>' +
          [''].concat(list).map(function (v) {
            var n = v ? LINKS.filter(function (l) { return l[key] === v; }).length : LINKS.length;
            return '<button type="button" class="pill" data-key="' + key + '" data-v="' + v + '" aria-pressed="' + (state[key] === v) + '">' +
              esc(v ? t(v) : t('all')) + ' <span aria-hidden="true">· ' + n + '</span></button>';
          }).join('');
      }

      function renderList() {
        var q = norm(state.q.trim());
        var items = LINKS.filter(function (l) {
          if (state.region && l.region !== state.region) return false;
          if (state.cat && l.cat !== state.cat) return false;
          if (!q) return true;
          return norm([l.name, l.desc.en, l.desc.hu, host(l.url), l.country || '', t(l.cat), t(l.region)].join(' ')).indexOf(q) >= 0;
        });
        items.sort(function (a, b) {
          return (b.reef42 ? 1 : 0) - (a.reef42 ? 1 : 0) || REGIONS.indexOf(a.region) - REGIONS.indexOf(b.region) ||
            CATS.indexOf(a.cat) - CATS.indexOf(b.cat);
        });
        document.getElementById('count').textContent = t('count').replace('{n}', items.length);
        var list = document.getElementById('list');
        if (!items.length) { list.innerHTML = '<li class="empty">' + esc(t('none')) + '</li>'; return; }
        list.innerHTML = items.map(function (l) {
          var tags = (l.reef42 ? '<span class="tag own">' + esc(t('own')) + '</span>' : '') +
            '<span class="tag">' + esc(t(l.region)) + (l.country ? ' · ' + esc(l.country.toLowerCase()) : '') + '</span>' +
            '<span class="tag">' + esc(t(l.cat)) + '</span>';
          var body = '<h2>' + esc(l.name) + '</h2><p>' + esc(l.desc[lang] || l.desc.en) + '</p>' +
            '<span class="host">' + esc(l.url ? host(l.url) : t('soon')) + '</span><div class="meta">' + tags + '</div>';
          var cls = 'card' + (l.reef42 ? ' own' : '') + (l.url ? '' : ' soon');
          return '<li>' + (l.url
            ? '<a class="' + cls + '" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + body + '</a>'
            : '<div class="' + cls + '">' + body + '</div>') + '</li>';
        }).join('');
      }

      function render() {
        document.documentElement.lang = lang;
        document.title = t('docTitle');
        document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
        var btn = document.getElementById('lang');
        btn.textContent = t('toggle');
        btn.setAttribute('lang', lang === 'hu' ? 'en' : 'hu');
        var q = document.getElementById('q');
        q.placeholder = t('search');
        q.setAttribute('aria-label', t('search'));
        pills(document.getElementById('regions'), REGIONS, 'region');
        pills(document.getElementById('cats'), CATS, 'cat');
        document.getElementById('regions').setAttribute('aria-label', t('region'));
        document.getElementById('cats').setAttribute('aria-label', t('type'));
        renderList();
      }

      document.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.id === 'lang') { lang = lang === 'hu' ? 'en' : 'hu'; save(lang); render(); return; }
        if (b.dataset.key) {
          state[b.dataset.key] = b.dataset.v;
          writeHash();
          render();
          var again = document.querySelector('button[data-key="' + b.dataset.key + '"][data-v="' + b.dataset.v + '"]');
          if (again) again.focus();
        }
      });
      document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value; renderList(); });

      render();
    })();
  </script>
</body>
</html>
